        function task48() {
            let result = "";
            let i = 1;

            while (i <= 1000) {
                let strnum = i.toString();
                let x = strnum.split("").reverse().join("");
                let reverse = parseInt(x);
                let isPrime = true;
                if (reverse <= 1) {

                    let j = 2;
                    while (j <= Math.sqrt(reverse)) {

                        }
                        j++;
                    }
