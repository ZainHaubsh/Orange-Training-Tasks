        function task1(arr){
            let first=arr.slice(0,1);
            let last=arr.slice(-1);
            let result=first.concat(last);
            document.getElementById("task1").innerHTML="Task1: "+result;
        }

            let b=arr.splice(1,2);
            let result=a.concat(b);
            document.getElementById("task2").innerHTML="Task2: "+result;
        }
        function task3(arr){
            let a=arr.splice(0,1);
            let b=arr.splice(-1);
            arr.push(a);
            arr.unshift(b);
            arr=arr.toString();
            document.getElementById("task3").innerHTML="Task3: "+arr;
        }
        function task4(arr){
            let a=arr.splice(0,2);
            arr.unshift(10);
            arr=a.concat(arr);
            document.getElementById("task4").innerHTML="Task4: "+arr;
        }

            let a=[];
            for (let i=0;i<arr.length;i++){
                if (!a.includes(arr[i]))
                a.push(arr[i]);
            }
            document.getElementById("task6").innerHTML="Task6: "+a;
        }

            arr=arr.sort((a, b) => a - b);

            if(arr[i]>=10)

        function task11(arr){

            if(arr[i]==2)
            a.push(arr[i]);
            document.getElementById("task11").innerHTML="Task11: "+ a.length;
        }
        function task12(arr,arr2){
            let a=[];
            for(let i=0;i<arr.length;i++)
            if(arr2.includes(arr[i]))
            a.push(arr[i]);
            document.getElementById("task12").innerHTML="Task12: "+ a;
        }
        function task13(arr,arr2){

            for(let i=0;i<arr.length;i++)
            if(!arr2.includes(arr[i]))
            a.push(arr[i]);
            document.getElementById("task13").innerHTML="Task13: "+ a;
        }
        function task14(arr,arr2){
            let a=[];
            for(let i=0;i<arr.length;i++)
            if(!a.includes(arr[i]))
            a.push(arr[i]);
        for(let i=0;i<arr.length;i++)
            if(!a.includes(arr2[i]))
            a.push(arr2[i]);
            document.getElementById("task14").innerHTML="Task14: "+ a;
        }
        function task15(arr){
            let a=[];
            for(let i=0;i<arr.length;i++)
            if(arr[i]>0)
            a.push(arr[i]);
            document.getElementById("task15").innerHTML="Task15: "+ a;
        }
        function task16(arr,len){
            let a=arr.filter(function(word) {
                return word.length > len; 
            });
            document.getElementById("task16").innerHTML="Task16: "+ a;
        }
        function task17(arr,letter){
            let a=arr.filter(function(word) {
                return word.includes(letter); 
            });
            document.getElementById("task17").innerHTML="Task17: "+ a.length;
        }
        function task18(arr,len){
            let a=arr.filter(function(word) {
                return word.length >= len; 
            });
            document.getElementById("task18").innerHTML="Task18: "+ a;
        }
        function task19(arr){
            let a=arr.sort((a,b)=>a.length-b.length)
            document.getElementById("task19").innerHTML="Task19: "+ a[a.length-1];
        }
        function task20(arr){
            let a=arr.sort((a,b)=>a.length-b.length)
            document.getElementById("task20").innerHTML="Task20: "+ a[0];
        }
        function task21(arr){
            let a=arr.sort((a,b)=>a.length-b.length);
            document.getElementById("task21").innerHTML="Task21: "+ a;
        }
        function task22(arr){
            let a=[];
            for(let i=0;i<arr.length;i++){
                if (i%2==0)
                a.push(arr[i]);
            }

            document.getElementById("task22").innerHTML="Task22: "+ a;
        }
        function task23(arr){
            let a=[];
            let sum=0;
            for(let i=0;i<arr.length;i++){
                if (arr[i]%2==0)
                sum+=arr[i];
            }

            document.getElementById("task23").innerHTML="Task23: "+ sum;
        }
        function task24(arr){
            let a=[];
            let sum=0;
            for(let i=0;i<arr.length;i++){
                if (i%2!=0)
                sum+=arr[i];
            }
            document.getElementById("task24").innerHTML="Task24: "+ sum;
        }
        function task25(arr){
            let a=[];
            let sum=0;
            for(let i=0;i<arr.length;i++){
                a.unshift(arr[i]);
            }
            document.getElementById("task25").innerHTML="Task25: "+a;
        }
        function task26(arr){
            let a=[];
            let result=0;
            for(let i=0;i<arr.length-1;i++){
                let current=arr[i];
                let next=arr[i+1];
                if(next-current!=1)
                result=current+1;
                
            }
            document.getElementById("task26").innerHTML="Task26: "+result;
        }
        function task27(arr,target){
            let a = [];
            for (let i = 0; i < arr.length - 1; i++){
                for (let j = i + 1; j < arr.length; j++){
                    if (arr[i] + arr[j] == target){
                        a.push(arr[i]);
                        a.push(arr[j]);
                        break; 
                    }
                }
            }
            document.getElementById("task27").innerHTML = "Task27: " + a;
        }
        function task28(arr,steps){ 
            for (let i = 0; i < steps; i++) {
                let lastElement = arr.pop(); 
                arr.unshift(lastElement); 
            }
            document.getElementById("task28").innerHTML = "Task28: " + arr;
        }
        function task29(arr,size){
            let result=[];
            for (let i = 0; i < arr.length; i += size) {
                let a = arr.slice(i, i + size);
                result.push(a);
            }
            document.getElementById("task29").innerHTML="Task29: "+JSON.stringify(result);
        }
        function task30(arr){
            let result= {};
            for (let i = 0; i < arr.length; i++) {
                let len=arr[i].length;
                if (!result[len]) {
                    result[len] = [];
                }
                result[len].push(arr[i]);
            }
            document.getElementById("task30").innerHTML="Task30: "+JSON.stringify(result);
        }
