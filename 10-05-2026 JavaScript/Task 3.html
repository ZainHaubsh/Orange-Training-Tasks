<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle</title>
</head>
<body>
    
    <script>
        const pi=3.14159265359;
        let r=5;
        area(pi,r);
        circumference (pi,r);
        function area(pi,r){
            console.log("Area= ",pi*r*r);
        }
        function circumference (pi,r){
            console.log("Circumference= " ,2*pi*r);
        }
    </script>
</body>
</html>
