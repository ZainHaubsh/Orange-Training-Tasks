<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Category</title>
</head>
<body>
    <script>
        let age=parseInt(prompt("Enter your age"));
        let result;
        check(age);
        alert(`You are a ${result}`);
        console.log(`You are a ${result}`)

        function check(age){
            if(age<13) result="Child";
            else if (13<=age && age<=19) result="Teenager";
            else if (20<=age && age<=59) result="Adult";
            else if (age<=60) result="Senior";
        }
    </script>
</body>
</html>
